[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roclec-spec-kit"
dynamic = ["version"]
description = "Configurable spec and release workflow for software projects"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = []

[project.optional-dependencies]
# `roclec view`: local read-only server. The compiled interface itself ships in the base wheel.
viewer = ["flask>=3.1,<4"]

[project.scripts]
roclec = "roclec_spec_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "roclec_spec_kit.__version__"}

[tool.setuptools.package-data]
roclec_spec_kit = [
  "assets/agents/*.md",
  "assets/skills/*/SKILL.md",
  "assets/skills/*/references/*.md",
  "assets/project/*.md",
  "assets/project/*.toml",
  "assets/profiles/*.json",
  "assets/templates/*.md",
  "assets/notices/*",
  "assets/legacy/skills/*/SKILL.md",
  "assets/legacy/skills/*/references/*.md",
  "assets/legacy/project/*.md",
  "assets/legacy/templates/*.md",
  "assets/legacy/notices/*",
  "assets/legacy/profiles/*.json",
  "viewer/static/*",
  "viewer/static/assets/*",
]
