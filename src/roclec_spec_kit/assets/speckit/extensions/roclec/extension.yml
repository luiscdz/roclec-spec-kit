schema_version: "1.0"

extension:
  id: roclec
  name: "Roclec delivery workflow"
  version: "0.2.0"
  description: "Configurable sync, UX, ready gate and release commands backed by roclec CLI"
  category: "process"
  effect: "read-write"
  author: "Roclec"
  license: "UNLICENSED"

requires:
  speckit_version: ">=0.13.0"

provides:
  commands:
    - name: speckit.roclec.sync
      file: commands/speckit.roclec.sync.md
      description: "Fill and validate spec front matter, then regenerate views"
    - name: speckit.roclec.ux
      file: commands/speckit.roclec.ux.md
      description: "Write UX details for a user-facing component"
    - name: speckit.roclec.prototype
      file: commands/speckit.roclec.prototype.md
      description: "Create and review a clickable prototype"
    - name: speckit.roclec.gate
      file: commands/speckit.roclec.gate.md
      description: "Run the ready-to-plan gate"
    - name: speckit.roclec.release
      file: commands/speckit.roclec.release.md
      description: "Plan or close a component release"

hooks:
  after_specify:
    command: speckit.roclec.sync
    optional: false
    description: "Sync project metadata and generated views"
  after_clarify:
    command: speckit.roclec.sync
    optional: false
    description: "Sync clarified spec metadata"
  before_plan:
    command: speckit.roclec.gate
    optional: false
    description: "Block planning until the ready gate passes"
  after_tasks:
    command: speckit.analyze
    optional: false
    description: "Review consistency before release planning"

tags:
  - "roclec"
  - "process"
