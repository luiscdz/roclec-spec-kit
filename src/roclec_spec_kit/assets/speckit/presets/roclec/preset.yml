schema_version: "1.0"

preset:
  id: "roclec"
  name: "Roclec project templates"
  version: "0.1.0"
  description: "Configurable specs, plans and component-tagged tasks"
  author: "Roclec"
  license: "UNLICENSED"

requires:
  speckit_version: ">=0.13.0"

provides:
  templates:
    - type: "template"
      name: "spec-template"
      file: "templates/spec-template.md"
      description: "Roclec spec with project-configured components"
      replaces: "spec-template"
    - type: "template"
      name: "plan-template"
      file: "templates/plan-template.md"
      description: "Plan grounded in configured code repositories"
      replaces: "plan-template"
    - type: "template"
      name: "tasks-template"
      file: "templates/tasks-template.md"
      description: "Tasks tagged by configured component"
      replaces: "tasks-template"
    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "Run implementation from configured code component after Roclec gates"
      replaces: "speckit.implement"
    - type: "command"
      name: "speckit.converge"
      file: "commands/speckit.converge.md"
      description: "Verify convergence against code in configured repositories"
      replaces: "speckit.converge"

tags:
  - "roclec"
  - "configurable"
