name: Check

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          git config --global user.name "Roclec CI"
          git config --global user.email "ci@example.invalid"
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - run: python scripts/harness.py --wheel dist/*.whl --report "$RUNNER_TEMP/roclec-harness.json"
      - name: Install pinned spec-kit
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python -m pip install 'specify-cli @ git+https://github.com/github/spec-kit.git@v0.13.4'
      - name: Verify native and spec-kit installation
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.11'
        run: python scripts/harness.py --wheel dist/*.whl --report "$RUNNER_TEMP/roclec-spec-kit.json" --spec-kit
